name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same branch or PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client

    steps:
      - uses: actions/checkout@v4
        with:
          # release-please and `nx affected` both want history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

# Not yet present, and deliberately not stubbed — a workflow that fails until
# the tooling catches up trains you to ignore red. Added as each lands:
#   - Vitest                  (docs/architecture.md §7.2)
#   - pgTAP via supabase CLI  (§7.3 — the RLS suite; mandatory once RLS exists)
#   - Playwright e2e          (§7.4)
#   - supabase gen types      (§7.1 — assert regenerating produces no diff)
# Deployment lives in deploy-dev.yml / deploy-prod.yml (§6.3), which need the
# Supabase and Cloudflare projects to exist first.
